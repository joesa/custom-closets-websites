<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1030" viewBox="0 0 2400 1030">
  <!-- Lumina — the SAME 6'-6" reach-in niche as wall-after.svg, surveyed before
       the build. Wall extents, floor line, ceiling line, corner returns and the
       overall dimension lines share exact coordinates with the after drawing so
       the compare slider reads as one room. Canvas is 2400x1030 (21:9) to match
       the before/after slider's desktop crop; content is authored at 2400x1200
       and uniformly scaled/centered via the outer <g> below. -->
  <defs>
    <marker id="arrowLb" markerWidth="12" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M12,0 L0,5 L12,10 z" fill="#8a7256"/>
    </marker>
    <marker id="arrowRb" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#8a7256"/>
    </marker>
  </defs>

  <rect width="2400" height="1030" fill="#f5efe4"/>
  <g transform="translate(170.5 0) scale(0.858)">

  <!-- floor line + ground hatch (identical to after) -->
  <line x1="260" y1="980" x2="2140" y2="980" stroke="#241f1a" stroke-width="4"/>
  <g stroke="#a89a86" stroke-width="2">
    <line x1="300" y1="980" x2="280" y2="1006"/><line x1="400" y1="980" x2="380" y2="1006"/>
    <line x1="500" y1="980" x2="480" y2="1006"/><line x1="600" y1="980" x2="580" y2="1006"/>
    <line x1="700" y1="980" x2="680" y2="1006"/><line x1="800" y1="980" x2="780" y2="1006"/>
    <line x1="900" y1="980" x2="880" y2="1006"/><line x1="1000" y1="980" x2="980" y2="1006"/>
    <line x1="1100" y1="980" x2="1080" y2="1006"/><line x1="1200" y1="980" x2="1180" y2="1006"/>
    <line x1="1300" y1="980" x2="1280" y2="1006"/><line x1="1400" y1="980" x2="1380" y2="1006"/>
    <line x1="1500" y1="980" x2="1480" y2="1006"/><line x1="1600" y1="980" x2="1580" y2="1006"/>
    <line x1="1700" y1="980" x2="1680" y2="1006"/><line x1="1800" y1="980" x2="1780" y2="1006"/>
    <line x1="1900" y1="980" x2="1880" y2="1006"/><line x1="2000" y1="980" x2="1980" y2="1006"/>
    <line x1="2100" y1="980" x2="2080" y2="1006"/>
  </g>

  <!-- wall extents + corner returns (identical) -->
  <line x1="380" y1="190" x2="380" y2="980" stroke="#5a4f42" stroke-width="2"/>
  <line x1="2020" y1="190" x2="2020" y2="980" stroke="#5a4f42" stroke-width="2"/>
  <line x1="380" y1="190" x2="2020" y2="190" stroke="#5a4f42" stroke-width="2"/>
  <path d="M380 230 h34 M380 230 v-34" stroke="#5a4f42" stroke-width="2" fill="none"/>
  <path d="M2020 230 h-34 M2020 230 v-34" stroke="#5a4f42" stroke-width="2" fill="none"/>

  <!-- overall width dimension (identical position to after) -->
  <line x1="380" y1="140" x2="2020" y2="140" stroke="#8a7256" stroke-width="2.5" marker-start="url(#arrowLb)" marker-end="url(#arrowRb)"/>
  <rect x="1040" y="112" width="320" height="52" fill="#f5efe4"/>
  <text x="1200" y="149" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" letter-spacing="3" fill="#8a7256">6&#8217;-6&#8221; NICHE WIDTH</text>

  <!-- overall height dimension (identical position to after) -->
  <line x1="300" y1="190" x2="300" y2="980" stroke="#8a7256" stroke-width="2.5" marker-start="url(#arrowLb)" marker-end="url(#arrowRb)"/>
  <g transform="translate(228 585) rotate(-90)">
    <rect x="-150" y="-26" width="300" height="50" fill="#f5efe4"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" letter-spacing="3" fill="#8a7256">8&#8217;-0&#8221; CEILING HT.</text>
  </g>

  <!-- overhead fixture: single bare bulb, same position as after's fixture -->
  <g stroke="#241f1a" stroke-width="2.5" fill="none">
    <line x1="1200" y1="190" x2="1200" y2="250"/>
    <circle cx="1200" cy="270" r="20"/>
    <path d="M1188 288 q12 26 24 0"/>
  </g>

  <!-- ── Existing clutter, drawn as field-survey outlines ─────────── -->
  <!-- water-stained back wall -->
  <g fill="#c9b79a" opacity="0.35">
    <ellipse cx="620" cy="330" rx="110" ry="60"/>
    <ellipse cx="700" cy="380" rx="70" ry="40"/>
    <ellipse cx="1650" cy="300" rx="90" ry="50"/>
  </g>

  <!-- sagging wire shelf, back wall -->
  <g stroke="#5a4f42" stroke-width="3" fill="none">
    <rect x="460" y="400" width="1080" height="10"/>
    <path d="M460 410 Q1000 448 1540 410"/>
  </g>
  <!-- hang rod with mismatched hangers -->
  <line x1="460" y1="560" x2="1000" y2="560" stroke="#5a4f42" stroke-width="4"/>
  <g stroke="#5a4f42" stroke-width="2" fill="none">
    <path d="M520 560 v34 l-26 26 h52 l-26-26"/>
    <path d="M620 560 v40 l-30 30 h60 l-30-30" transform="rotate(-6 620 560)"/>
    <path d="M740 560 v30 l-24 24 h48 l-24-24"/>
    <path d="M860 560 v46 l-32 30 h64 l-32-30" transform="rotate(5 860 560)"/>
  </g>

  <!-- stacked moving boxes, right side -->
  <g stroke="#5a4f42" stroke-width="3" fill="#efe6d6">
    <rect x="1100" y="760" width="220" height="150"/>
    <rect x="1140" y="620" width="200" height="130" transform="rotate(-3 1240 685)"/>
    <rect x="1120" y="500" width="150" height="110"/>
  </g>
  <g stroke="#a89a86" stroke-width="2">
    <line x1="1100" y1="835" x2="1320" y2="835"/>
    <line x1="1140" y1="685" x2="1340" y2="685"/>
  </g>

  <!-- floor clutter: loose shoes + a dropped garment -->
  <g stroke="#5a4f42" stroke-width="2.5" fill="none">
    <path d="M470 940 q40 -30 90 0 q10 20 -20 26 h-60 q-24 -8 -10 -26 z"/>
    <path d="M600 950 q40 -26 88 0 q8 18 -18 24 h-58 q-22 -6 -12 -24 z" transform="rotate(8 640 950)"/>
  </g>
  <path d="M1450 900 q-20 30 10 60 q60 20 110 -6 q20 -30 -10 -50 q-50 -20 -110 -4 z" stroke="#5a4f42" stroke-width="2" fill="#efe6d6" opacity="0.8"/>

  <!-- field-note callouts — rows ordered top-to-bottom to match each source's
       vertical position, so the leader lines fan out without crossing -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <line x1="1200" y1="270" x2="1650" y2="210" stroke="#8a7256" stroke-width="2"/>
    <circle cx="1200" cy="270" r="5" fill="#8a7256"/>
    <text x="1666" y="218" font-size="25" font-weight="bold" letter-spacing="1" fill="#241f1a">SINGLE BULB <tspan fill="#5a4f42" font-weight="normal">&#8212; no dimmer</tspan></text>

    <line x1="1650" y1="300" x2="1650" y2="320" stroke="#8a7256" stroke-width="2"/>
    <circle cx="1650" cy="300" r="5" fill="#8a7256"/>
    <text x="1666" y="328" font-size="25" font-weight="bold" letter-spacing="1" fill="#241f1a">WATER STAIN <tspan fill="#5a4f42" font-weight="normal">&#8212; repair + repaint</tspan></text>

    <line x1="1540" y1="400" x2="1650" y2="430" stroke="#8a7256" stroke-width="2"/>
    <circle cx="1540" cy="400" r="5" fill="#8a7256"/>
    <text x="1666" y="438" font-size="25" font-weight="bold" letter-spacing="1" fill="#241f1a">WIRE SHELF <tspan fill="#5a4f42" font-weight="normal">&#8212; sagging, remove</tspan></text>

    <line x1="850" y1="590" x2="470" y2="720" stroke="#8a7256" stroke-width="2"/>
    <circle cx="850" cy="590" r="5" fill="#8a7256"/>
    <text x="460" y="742" text-anchor="end" font-size="25" font-weight="bold" letter-spacing="1" fill="#241f1a">RIGID ROD <tspan fill="#5a4f42" font-weight="normal">&#8212; one height only</tspan></text>
  </g>

  <!-- title block, same position as after -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="1640" y="1030" width="380" height="150" fill="#f5efe4" stroke="#241f1a" stroke-width="3"/>
    <line x1="1640" y1="1078" x2="2020" y2="1078" stroke="#241f1a" stroke-width="2"/>
    <line x1="1640" y1="1126" x2="2020" y2="1126" stroke="#241f1a" stroke-width="2"/>
    <rect x="1640" y="1030" width="8" height="150" fill="#8a7256"/>
    <text x="1664" y="1062" font-size="20" font-weight="bold" letter-spacing="1" fill="#241f1a">LUMINA CUSTOM CLOSETS</text>
    <text x="1664" y="1108" font-size="17" letter-spacing="1" fill="#5a4f42">EXISTING CONDITIONS</text>
    <text x="1664" y="1156" font-size="17" letter-spacing="1" fill="#5a4f42">FIELD SURVEY &#183; JOB NO. 24-0619</text>
    <text x="1664" y="1178" font-size="15" letter-spacing="1" fill="#8a7256">SAME NICHE AS SHEET 2</text>
  </g>
  <text x="260" y="1140" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="2" fill="#a89a86">NOT TO SCALE &#183; FIELD SKETCH</text>
  </g>
</svg>
