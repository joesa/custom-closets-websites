<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1030" viewBox="0 0 2400 1030">
  <!-- Ironclad — the SAME 18' wall as wall-after.svg, surveyed before the build.
       Wall extents, floor line, stud ticks and the overall dimension line share
       exact coordinates with the after drawing so the compare slider reads as
       one room. -->
  <defs>
    <marker id="arrowLb" markerWidth="12" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M12,0 L0,5 L12,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowRb" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="2400" height="1030" fill="#eceef0"/>

  <!-- floor line + ground hatch (identical to after) -->
  <line x1="90" y1="840" x2="2310" y2="840" stroke="#27272a" stroke-width="4"/>
  <g stroke="#a1a1aa" stroke-width="2">
    <line x1="140" y1="840" x2="118" y2="866"/><line x1="240" y1="840" x2="218" y2="866"/>
    <line x1="340" y1="840" x2="318" y2="866"/><line x1="440" y1="840" x2="418" y2="866"/>
    <line x1="540" y1="840" x2="518" y2="866"/><line x1="640" y1="840" x2="618" y2="866"/>
    <line x1="740" y1="840" x2="718" y2="866"/><line x1="840" y1="840" x2="818" y2="866"/>
    <line x1="940" y1="840" x2="918" y2="866"/><line x1="1040" y1="840" x2="1018" y2="866"/>
    <line x1="1140" y1="840" x2="1118" y2="866"/><line x1="1240" y1="840" x2="1218" y2="866"/>
    <line x1="1340" y1="840" x2="1318" y2="866"/><line x1="1440" y1="840" x2="1418" y2="866"/>
    <line x1="1540" y1="840" x2="1518" y2="866"/><line x1="1640" y1="840" x2="1618" y2="866"/>
    <line x1="1740" y1="840" x2="1718" y2="866"/><line x1="1840" y1="840" x2="1818" y2="866"/>
    <line x1="1940" y1="840" x2="1918" y2="866"/><line x1="2040" y1="840" x2="2018" y2="866"/>
    <line x1="2140" y1="840" x2="2118" y2="866"/><line x1="2240" y1="840" x2="2218" y2="866"/>
  </g>

  <!-- wall extents (identical) -->
  <line x1="170" y1="150" x2="170" y2="840" stroke="#52525b" stroke-width="2"/>
  <line x1="2230" y1="150" x2="2230" y2="840" stroke="#52525b" stroke-width="2"/>
  <line x1="170" y1="150" x2="2230" y2="150" stroke="#52525b" stroke-width="2"/>
  <g stroke="#a1a1aa" stroke-width="2">
    <line x1="280" y1="150" x2="280" y2="172"/><line x1="390" y1="150" x2="390" y2="172"/>
    <line x1="500" y1="150" x2="500" y2="172"/><line x1="610" y1="150" x2="610" y2="172"/>
    <line x1="720" y1="150" x2="720" y2="172"/><line x1="830" y1="150" x2="830" y2="172"/>
    <line x1="940" y1="150" x2="940" y2="172"/><line x1="1050" y1="150" x2="1050" y2="172"/>
    <line x1="1160" y1="150" x2="1160" y2="172"/><line x1="1270" y1="150" x2="1270" y2="172"/>
    <line x1="1380" y1="150" x2="1380" y2="172"/><line x1="1490" y1="150" x2="1490" y2="172"/>
    <line x1="1600" y1="150" x2="1600" y2="172"/><line x1="1710" y1="150" x2="1710" y2="172"/>
    <line x1="1820" y1="150" x2="1820" y2="172"/><line x1="1930" y1="150" x2="1930" y2="172"/>
    <line x1="2040" y1="150" x2="2040" y2="172"/><line x1="2150" y1="150" x2="2150" y2="172"/>
  </g>
  <text x="2230" y="136" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3" fill="#52525b">STUDS 16&#8221; O.C. VERIFIED</text>

  <!-- overall dimension line (identical position to after) -->
  <line x1="170" y1="222" x2="2230" y2="222" stroke="#b91c1c" stroke-width="2.5" marker-start="url(#arrowLb)" marker-end="url(#arrowRb)"/>
  <rect x="1020" y="196" width="360" height="52" fill="#eceef0"/>
  <text x="1200" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" letter-spacing="4" fill="#b91c1c">18&#8217;-0&#8221; WALL RUN</text>

  <!-- ── Existing clutter, drawn as field-survey outlines ─────────── -->
  <!-- stacked boxes -->
  <g stroke="#52525b" stroke-width="3" fill="#f4f5f7">
    <rect x="210" y="700" width="220" height="140"/>
    <rect x="250" y="580" width="200" height="120"/>
    <rect x="230" y="470" width="160" height="110"/>
    <rect x="290" y="380" width="120" height="90" transform="rotate(-4 350 425)"/>
  </g>
  <g stroke="#a1a1aa" stroke-width="2">
    <line x1="210" y1="770" x2="430" y2="770"/>
    <line x1="250" y1="640" x2="450" y2="640"/>
  </g>
  <text x="320" y="930" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3" fill="#71717a">STACKED BOXES</text>

  <!-- bike, simplified survey outline -->
  <g stroke="#52525b" stroke-width="3" fill="none">
    <circle cx="640" cy="750" r="88"/>
    <circle cx="920" cy="750" r="88"/>
    <path d="M640 750 L740 590 L900 590 L920 750 L780 750 z"/>
    <line x1="740" y1="590" x2="716" y2="540"/>
    <line x1="688" y1="540" x2="748" y2="540"/>
    <line x1="900" y1="590" x2="912" y2="528"/>
    <line x1="878" y1="524" x2="944" y2="532"/>
  </g>
  <text x="780" y="930" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3" fill="#71717a">BIKE — RELOCATE</text>

  <!-- sagging wire shelf -->
  <g stroke="#52525b" stroke-width="3" fill="none" transform="rotate(-2 1250 620)">
    <rect x="1080" y="440" width="360" height="400"/>
    <path d="M1080 540 Q1260 566 1440 540"/>
    <path d="M1080 650 Q1260 682 1440 650"/>
    <path d="M1080 760 Q1260 780 1440 760"/>
    <line x1="1080" y1="440" x2="1080" y2="840"/>
    <line x1="1440" y1="440" x2="1440" y2="840"/>
  </g>
  <g stroke="#a1a1aa" stroke-width="2" fill="none">
    <rect x="1120" y="480" width="90" height="52" transform="rotate(-3 1165 506)"/>
    <rect x="1250" y="470" width="120" height="60" transform="rotate(2 1310 500)"/>
    <rect x="1140" y="580" width="130" height="60" transform="rotate(-2 1205 610)"/>
  </g>
  <text x="1258" y="930" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3" fill="#71717a">WIRE SHELF — REMOVE</text>

  <!-- leaning long-handle tools -->
  <g stroke="#52525b" stroke-width="4" fill="none">
    <line x1="1560" y1="840" x2="1640" y2="430"/>
    <line x1="1600" y1="840" x2="1665" y2="450"/>
    <line x1="1645" y1="840" x2="1690" y2="470"/>
    <path d="M1622 430 h40 v24 h-40 z"/>
    <path d="M1650 444 a18 18 0 1 1 30 12"/>
  </g>
  <text x="1640" y="930" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3" fill="#71717a">YARD TOOLS</text>

  <!-- paint cans -->
  <g stroke="#52525b" stroke-width="3" fill="#f4f5f7">
    <rect x="1760" y="760" width="70" height="80" rx="4"/>
    <rect x="1840" y="760" width="70" height="80" rx="4"/>
    <rect x="1800" y="676" width="70" height="80" rx="4"/>
  </g>
  <ellipse cx="1835" cy="676" rx="35" ry="10" fill="#f4f5f7" stroke="#52525b" stroke-width="3"/>

  <!-- outlet + field notes -->
  <rect x="1508" y="686" width="26" height="40" fill="#f8fafc" stroke="#52525b" stroke-width="3"/>
  <circle cx="1521" cy="698" r="3" fill="#52525b"/>
  <circle cx="1521" cy="714" r="3" fill="#52525b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="1521" y1="686" x2="1440" y2="396" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="1521" cy="686" r="5" fill="#b91c1c"/>
    <text x="1430" y="384" text-anchor="end" font-size="26" font-weight="bold" letter-spacing="2" fill="#27272a">SINGLE OUTLET <tspan fill="#71717a" font-weight="normal">— ADD CIRCUIT</tspan></text>

    <line x1="520" y1="330" x2="580" y2="296" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="520" cy="330" r="5" fill="#b91c1c"/>
    <text x="590" y="288" font-size="26" font-weight="bold" letter-spacing="2" fill="#27272a">OPEN WALL <tspan fill="#71717a" font-weight="normal">— ADD BLOCKING FOR LOAD</tspan></text>

    <line x1="2020" y1="840" x2="2150" y2="668" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="2020" cy="840" r="5" fill="#b91c1c"/>
    <text x="2290" y="648" text-anchor="end" font-size="26" font-weight="bold" letter-spacing="2" fill="#27272a">SLAB OK <tspan fill="#71717a" font-weight="normal">— 1/2&#8221; SLOPE</tspan></text>
  </g>

  <!-- title block, same position as after -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="2020" y="380" width="290" height="200" fill="#f8fafc" stroke="#27272a" stroke-width="3"/>
    <line x1="2020" y1="440" x2="2310" y2="440" stroke="#27272a" stroke-width="2"/>
    <line x1="2020" y1="496" x2="2310" y2="496" stroke="#27272a" stroke-width="2"/>
    <rect x="2020" y="380" width="10" height="200" fill="#b91c1c"/>
    <text x="2048" y="418" font-size="21" font-weight="bold" letter-spacing="1" fill="#27272a">IRONCLAD STORAGE CO.</text>
    <text x="2048" y="474" font-size="19" letter-spacing="1" fill="#52525b">EXISTING CONDITIONS</text>
    <text x="2048" y="532" font-size="19" letter-spacing="1" fill="#52525b">FIELD SURVEY &#183; JOB 24-118</text>
    <text x="2048" y="562" font-size="19" letter-spacing="1" fill="#52525b">SAME WALL AS SHEET A</text>
  </g>
</svg>
