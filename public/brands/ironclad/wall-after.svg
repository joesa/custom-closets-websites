<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1030" viewBox="0 0 2400 1030">
  <!-- Ironclad — the SAME 18' wall as wall-before.svg, after the install.
       Shares exact wall/floor/dimension coordinates with the before drawing. -->
  <defs>
    <pattern id="slat" width="20" height="36" patternUnits="userSpaceOnUse">
      <rect width="20" height="36" fill="#f4f5f7"/>
      <line x1="0" y1="30" x2="20" y2="30" stroke="#a1a1aa" stroke-width="2"/>
      <line x1="0" y1="34" x2="20" y2="34" stroke="#d4d4d8" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse">
      <line x1="0" y1="14" x2="14" y2="0" stroke="#a1a1aa" stroke-width="1.5"/>
    </pattern>
    <marker id="arrowL" markerWidth="12" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M12,0 L0,5 L12,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowR" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="2400" height="1000" fill="#eceef0"/>

  <!-- floor line + ground hatch -->
  <line x1="90" y1="840" x2="2310" y2="840" stroke="#27272a" stroke-width="4"/>
  <g stroke="#a1a1aa" stroke-width="2">
    <line x1="140" y1="840" x2="118" y2="866"/><line x1="240" y1="840" x2="218" y2="866"/>
    <line x1="340" y1="840" x2="318" y2="866"/><line x1="440" y1="840" x2="418" y2="866"/>
    <line x1="540" y1="840" x2="518" y2="866"/><line x1="640" y1="840" x2="618" y2="866"/>
    <line x1="740" y1="840" x2="718" y2="866"/><line x1="840" y1="840" x2="818" y2="866"/>
    <line x1="940" y1="840" x2="918" y2="866"/><line x1="1040" y1="840" x2="1018" y2="866"/>
    <line x1="1140" y1="840" x2="1118" y2="866"/><line x1="1240" y1="840" x2="1218" y2="866"/>
    <line x1="1340" y1="840" x2="1318" y2="866"/><line x1="1440" y1="840" x2="1418" y2="866"/>
    <line x1="1540" y1="840" x2="1518" y2="866"/><line x1="1640" y1="840" x2="1618" y2="866"/>
    <line x1="1740" y1="840" x2="1718" y2="866"/><line x1="1840" y1="840" x2="1818" y2="866"/>
    <line x1="1940" y1="840" x2="1918" y2="866"/><line x1="2040" y1="840" x2="2018" y2="866"/>
    <line x1="2140" y1="840" x2="2118" y2="866"/><line x1="2240" y1="840" x2="2218" y2="866"/>
  </g>

  <!-- wall extents -->
  <line x1="170" y1="150" x2="170" y2="840" stroke="#52525b" stroke-width="2"/>
  <line x1="2230" y1="150" x2="2230" y2="840" stroke="#52525b" stroke-width="2"/>

  <!-- stud ticks along top of wall, 16" o.c. -->
  <g stroke="#a1a1aa" stroke-width="2">
    <line x1="280" y1="150" x2="280" y2="172"/><line x1="390" y1="150" x2="390" y2="172"/>
    <line x1="500" y1="150" x2="500" y2="172"/><line x1="610" y1="150" x2="610" y2="172"/>
    <line x1="720" y1="150" x2="720" y2="172"/><line x1="830" y1="150" x2="830" y2="172"/>
    <line x1="940" y1="150" x2="940" y2="172"/><line x1="1050" y1="150" x2="1050" y2="172"/>
    <line x1="1160" y1="150" x2="1160" y2="172"/><line x1="1270" y1="150" x2="1270" y2="172"/>
    <line x1="1380" y1="150" x2="1380" y2="172"/><line x1="1490" y1="150" x2="1490" y2="172"/>
    <line x1="1600" y1="150" x2="1600" y2="172"/><line x1="1710" y1="150" x2="1710" y2="172"/>
    <line x1="1820" y1="150" x2="1820" y2="172"/><line x1="1930" y1="150" x2="1930" y2="172"/>
    <line x1="2040" y1="150" x2="2040" y2="172"/><line x1="2150" y1="150" x2="2150" y2="172"/>
  </g>
  <line x1="170" y1="150" x2="2230" y2="150" stroke="#52525b" stroke-width="2"/>
  <text x="2230" y="136" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3" fill="#52525b">STUDS 16&#8221; O.C.</text>

  <!-- overall dimension line -->
  <line x1="170" y1="222" x2="2230" y2="222" stroke="#b91c1c" stroke-width="2.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <rect x="1020" y="196" width="360" height="52" fill="#eceef0"/>
  <text x="1200" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" letter-spacing="4" fill="#b91c1c">18&#8217;-0&#8221; WALL RUN</text>

  <!-- ── Tall locker pair · IC-T30 ─────────────────────────────── -->
  <g>
    <rect x="190" y="300" width="260" height="540" fill="#f8fafc" stroke="#27272a" stroke-width="3"/>
    <line x1="320" y1="300" x2="320" y2="840" stroke="#27272a" stroke-width="2.5"/>
    <!-- door pulls -->
    <line x1="300" y1="480" x2="300" y2="560" stroke="#27272a" stroke-width="5"/>
    <line x1="340" y1="480" x2="340" y2="560" stroke="#27272a" stroke-width="5"/>
    <!-- louver vents -->
    <g stroke="#a1a1aa" stroke-width="2">
      <line x1="215" y1="340" x2="295" y2="340"/><line x1="215" y1="354" x2="295" y2="354"/><line x1="215" y1="368" x2="295" y2="368"/>
      <line x1="345" y1="340" x2="425" y2="340"/><line x1="345" y1="354" x2="425" y2="354"/><line x1="345" y1="368" x2="425" y2="368"/>
    </g>
    <!-- plinth -->
    <rect x="190" y="800" width="260" height="40" fill="#e4e4e7" stroke="#27272a" stroke-width="2.5"/>
  </g>

  <!-- ── Slatwall over bench · IC-SW8 / IC-B48 ─────────────────── -->
  <g>
    <rect x="480" y="330" width="550" height="280" fill="url(#slat)" stroke="#27272a" stroke-width="3"/>
    <!-- hung tools (outlines only) -->
    <g stroke="#52525b" stroke-width="3" fill="none">
      <circle cx="580" cy="420" r="34"/>
      <line x1="580" y1="454" x2="580" y2="520"/>
      <rect x="690" y="392" width="70" height="44"/>
      <line x1="725" y1="436" x2="725" y2="500"/>
      <path d="M840 400 h80 v26 h-52 l-14 40 h-14 z"/>
      <rect x="940" y="396" width="26" height="110"/>
    </g>
    <!-- bench top -->
    <rect x="470" y="622" width="570" height="26" fill="#d4d4d8" stroke="#27272a" stroke-width="3"/>
    <!-- base cabinets under bench -->
    <rect x="490" y="648" width="255" height="152" fill="#f8fafc" stroke="#27272a" stroke-width="3"/>
    <rect x="765" y="648" width="255" height="152" fill="#f8fafc" stroke="#27272a" stroke-width="3"/>
    <line x1="490" y1="724" x2="745" y2="724" stroke="#27272a" stroke-width="2.5"/>
    <line x1="765" y1="724" x2="1020" y2="724" stroke="#27272a" stroke-width="2.5"/>
    <g stroke="#27272a" stroke-width="5">
      <line x1="585" y1="686" x2="650" y2="686"/><line x1="585" y1="762" x2="650" y2="762"/>
      <line x1="860" y1="686" x2="925" y2="686"/><line x1="860" y1="762" x2="925" y2="762"/>
    </g>
    <rect x="490" y="800" width="530" height="40" fill="#e4e4e7" stroke="#27272a" stroke-width="2.5"/>
  </g>

  <!-- ── Overhead + drawer bank · IC-W36 ───────────────────────── -->
  <g>
    <rect x="1080" y="300" width="520" height="160" fill="#f8fafc" stroke="#27272a" stroke-width="3"/>
    <line x1="1253" y1="300" x2="1253" y2="460" stroke="#27272a" stroke-width="2.5"/>
    <line x1="1426" y1="300" x2="1426" y2="460" stroke="#27272a" stroke-width="2.5"/>
    <g stroke="#27272a" stroke-width="5">
      <line x1="1140" y1="430" x2="1195" y2="430"/><line x1="1310" y1="430" x2="1365" y2="430"/><line x1="1480" y1="430" x2="1535" y2="430"/>
    </g>
    <!-- counter -->
    <rect x="1070" y="596" width="540" height="26" fill="#d4d4d8" stroke="#27272a" stroke-width="3"/>
    <!-- drawer bank -->
    <rect x="1090" y="622" width="500" height="178" fill="#f8fafc" stroke="#27272a" stroke-width="3"/>
    <line x1="1090" y1="681" x2="1590" y2="681" stroke="#27272a" stroke-width="2.5"/>
    <line x1="1090" y1="740" x2="1590" y2="740" stroke="#27272a" stroke-width="2.5"/>
    <g stroke="#27272a" stroke-width="5">
      <line x1="1290" y1="652" x2="1390" y2="652"/>
      <line x1="1290" y1="711" x2="1390" y2="711"/>
      <line x1="1290" y1="770" x2="1390" y2="770"/>
    </g>
    <rect x="1090" y="800" width="500" height="40" fill="#e4e4e7" stroke="#27272a" stroke-width="2.5"/>
  </g>

  <!-- ── Second locker · IC-T30 ────────────────────────────────── -->
  <g>
    <rect x="1630" y="300" width="260" height="540" fill="#f8fafc" stroke="#27272a" stroke-width="3"/>
    <line x1="1760" y1="300" x2="1760" y2="840" stroke="#27272a" stroke-width="2.5"/>
    <line x1="1740" y1="480" x2="1740" y2="560" stroke="#27272a" stroke-width="5"/>
    <line x1="1780" y1="480" x2="1780" y2="560" stroke="#27272a" stroke-width="5"/>
    <g stroke="#a1a1aa" stroke-width="2">
      <line x1="1655" y1="340" x2="1735" y2="340"/><line x1="1655" y1="354" x2="1735" y2="354"/><line x1="1655" y1="368" x2="1735" y2="368"/>
      <line x1="1785" y1="340" x2="1865" y2="340"/><line x1="1785" y1="354" x2="1865" y2="354"/><line x1="1785" y1="368" x2="1865" y2="368"/>
    </g>
    <rect x="1630" y="800" width="260" height="40" fill="#e4e4e7" stroke="#27272a" stroke-width="2.5"/>
  </g>

  <!-- height dimension -->
  <line x1="1948" y1="300" x2="1948" y2="840" stroke="#b91c1c" stroke-width="2.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <line x1="1890" y1="300" x2="1962" y2="300" stroke="#b91c1c" stroke-width="2"/>
  <rect x="1922" y="520" width="52" height="120" fill="#eceef0"/>
  <text x="1955" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" letter-spacing="2" fill="#b91c1c" transform="rotate(-90 1955 580)">7&#8217;-0&#8221;</text>

  <!-- callouts -->
  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="320" y1="300" x2="382" y2="266" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="320" cy="300" r="5" fill="#b91c1c"/>
    <text x="392" y="272" font-size="26" font-weight="bold" letter-spacing="2" fill="#27272a">IC-T30 <tspan fill="#71717a" font-weight="normal">TALL LOCKER</tspan></text>

    <line x1="820" y1="330" x2="860" y2="288" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="820" cy="330" r="5" fill="#b91c1c"/>
    <text x="870" y="280" font-size="26" font-weight="bold" letter-spacing="2" fill="#27272a">IC-SW8 <tspan fill="#71717a" font-weight="normal">SLATWALL</tspan></text>

    <line x1="1340" y1="460" x2="1394" y2="500" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="1340" cy="460" r="5" fill="#b91c1c"/>
    <text x="1404" y="512" font-size="26" font-weight="bold" letter-spacing="2" fill="#27272a">IC-W36 <tspan fill="#71717a" font-weight="normal">OVERHEAD</tspan></text>

    <line x1="620" y1="782" x2="560" y2="900" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="620" cy="782" r="5" fill="#b91c1c"/>
    <text x="576" y="922" font-size="26" font-weight="bold" letter-spacing="2" fill="#27272a">IC-B48 <tspan fill="#71717a" font-weight="normal">BASE / BENCH</tspan></text>
  </g>

  <!-- title block, same position as before-drawing -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="2020" y="380" width="290" height="200" fill="#f8fafc" stroke="#27272a" stroke-width="3"/>
    <line x1="2020" y1="440" x2="2310" y2="440" stroke="#27272a" stroke-width="2"/>
    <line x1="2020" y1="496" x2="2310" y2="496" stroke="#27272a" stroke-width="2"/>
    <rect x="2020" y="380" width="10" height="200" fill="#b91c1c"/>
    <text x="2048" y="418" font-size="21" font-weight="bold" letter-spacing="1" fill="#27272a">IRONCLAD STORAGE CO.</text>
    <text x="2048" y="474" font-size="19" letter-spacing="1" fill="#52525b">AS-BUILT &#8212; SHEET A</text>
    <text x="2048" y="532" font-size="19" letter-spacing="1" fill="#52525b">JOB 24-118 &#183; ONE-DAY INSTALL</text>
    <text x="2048" y="562" font-size="19" letter-spacing="1" fill="#52525b">14-GA STEEL &#183; 1,500 LB</text>
  </g>
</svg>
